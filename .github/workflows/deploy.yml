name: Build and Publish to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".env.example"
      - "LICENSE"
      - ".vscode/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".env.example"
      - "LICENSE"
      - ".vscode/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Build Version
        run: |
          echo "BUILD_VERSION=${GITHUB_RUN_NUMBER}-$(TZ=Asia/Seoul date +%y%m%d)" >> "$GITHUB_ENV"

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_BUILD_VERSION=${{ env.BUILD_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  request-dca-deploy:
    name: Request DCA Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: web-deploy-main
      cancel-in-progress: true
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success'
    env:
      DCA_ADDR: ${{ secrets.DCA_ADDR }}
      DCA_SECRET: ${{ secrets.DCA_SECRET }}
    steps:
      - name: Send Deploy Request to DCA
        run: |
          curl --fail --request POST \
            --url "$DCA_ADDR" \
            --header "content-type: application/json" \
            --header "X-API-Key: $DCA_SECRET" \
            --data "{\"gh\": {\"commitSha\": \"$GITHUB_SHA\", \"githubRepo\": \"$GITHUB_REPOSITORY\"}}"
