<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="bodyDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="eraserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDA4AF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Tile -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#4338CA" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Iconic Pencil at 45° Angle -->
  <g filter="url(#glow)">
    <!-- Eraser -->
    <path d="M44 8 C47.5 11.5 49 13 50.5 14.5 C52 16 52 18.5 50.5 20 L46 24.5 L37.5 16 L42 11.5 C43 10.5 43.5 8.5 44 8 Z" fill="url(#eraserGrad)" />
    
    <!-- Metal Ferrule -->
    <path d="M37.5 16 L46 24.5 L43 27.5 L34.5 19 Z" fill="#CBD5E1" />
    <path d="M36 17.5 L44.5 26" stroke="#94A3B8" stroke-width="1" />

    <!-- Pencil Main Shaft (Upper facet) -->
    <path d="M23 30.5 L34.5 19 L43 27.5 L31.5 39 Z" fill="url(#bodyGrad)" />
    
    <!-- Pencil Lower Shadow facet -->
    <path d="M20 33.5 L31.5 39 L28 42.5 L16.5 37 Z" fill="url(#bodyDarkGrad)" />
    
    <!-- Highlight Line on Ridge -->
    <path d="M23 30.5 L34.5 19" stroke="#C7D2FE" stroke-width="1.2" stroke-linecap="round" />

    <!-- Sharpened Wooden Cone -->
    <path d="M16.5 37 L31.5 39 L8 54 Z" fill="url(#woodGrad)" />

    <!-- Graphite Lead Tip -->
    <path d="M8 54 L13 50 L11 48 Z" fill="#0F172A" />

    <!-- Creative Sparkle / Drawing Accent -->
    <circle cx="16" cy="16" r="2" fill="#38BDF8" />
    <path d="M16 11 L16 21 M11 16 L21 16" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>